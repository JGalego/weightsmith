[project]
name = "weightsmith"
version = "0.1.0"
description = "A programming language for weight-space programming: inspect, transform, compose and verify neural networks at the level of their parameters."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "João Galego", email = "jgalego1990@gmail.com" }]
keywords = ["neural-networks", "programming-language", "weight-space", "model-editing", "interpretability"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Compilers",
]
dependencies = [
    "lark>=1.2",
    "pydantic>=2.7",
    "pygments>=2.17",
    "rich>=13.7",
    "typer>=0.12",
    "safetensors>=0.4.3",
    "torch>=2.4",
    # Required by safetensors' torch serializer; Weightsmith itself does numerics in torch.
    "numpy>=1.26",
]

[project.scripts]
weightsmith = "weightsmith.cli.main:main"
wsmith = "weightsmith.cli.main:main"

[project.entry-points."pygments.lexers"]
weightsmith = "weightsmith.language.highlight:WeightsmithLexer"

[dependency-groups]
dev = ["pytest>=8.2", "ruff>=0.6", "pyright>=1.1.380"]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weightsmith"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "A", "SIM", "RUF", "PT"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
