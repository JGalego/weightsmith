[[package]]
name = "weightsmith"
version = "0.1.0"
source = { editable = "." }
dependencies = [
    { name = "lark" },
    { name = "numpy" },
    { name = "pydantic" },
    { name = "pygments" },
    { name = "rich" },
    { name = "safetensors" },
    { name = "torch", version = "2.15.0", source = { registry = "https://download.pytorch.org/whl/cpu" }, marker = "sys_platform == 'darwin'" },
    { name = "torch", version = "2.15.0+cpu", source = { registry = "https://download.pytorch.org/whl/cpu" }, marker = "sys_platform != 'darwin'" },
    { name = "typer" },
]

[package.optional-dependencies]
anthropic = [
    { name = "anthropic" },
]
hf = [
    { name = "transformers" },
]
lsp = [
    { name = "pygls" },
]
openai = [
    { name = "openai" },
]

[package.dev-dependencies]
dev = [
    { name = "anthropic" },
    { name = "openai" },
    { name = "pygls" },
    { name = "pyright" },
    { name = "pytest" },
    { name = "ruff" },
    { name = "transformers" },
]

[package.metadata]
requires-dist = [
    { name = "anthropic", marker = "extra == 'anthropic'", specifier = ">=2.4" },
    { name = "lark", specifier = ">=1.2" },
    { name = "numpy", specifier = ">=1.26" },
    { name = "openai", marker = "extra == 'openai'", specifier = ">=3.45" },
    { name = "pydantic", specifier = ">=2.7" },
    { name = "pygls", marker = "extra == 'lsp'", specifier = ">=2.1" },
    { name = "pygments", specifier = ">=2.17" },
    { name = "rich", specifier = ">=13.7" },
    { name = "safetensors", specifier = ">=0.4.3" },
    { name = "torch", specifier = ">=2.4", index = "https://download.pytorch.org/whl/cpu" },
    { name = "transformers", marker = "extra == 'hf'", specifier = ">=5.0" },
    { name = "typer", specifier = ">=0.12" },
]
provides-extras = ["hf", "anthropic", "openai", "lsp"]

[package.metadata.requires-dev]
dev = [
    { name = "anthropic", specifier = ">=2.4" },
    { name = "openai", specifier = ">=3.45" },
    { name = "pygls", specifier = ">=2.1" },
    { name = "pyright", specifier = ">=1.1.380" },
