<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 10 120 102" width="120" height="102" role="img" aria-label="Weightsmith logo">
  <title>Weightsmith</title>
  <defs>
    <radialGradient id="hotspot" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFBEB"/>
      <stop offset="0.3" stop-color="#FBBF24"/>
      <stop offset="0.7" stop-color="#F97316" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#F97316" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
  </defs>

  <g transform="translate(-4 -6)">
  <!-- the anvil in three-quarter view: heel left, step, horn right, waist, four-footed base.
       Receding edges run up and to the left, so the top and the left-facing ends show.
       Three flat tones of one slate: light tops, mid ends, dark front. -->
  <g fill="#94A3B8">
    <!-- left-facing ends: base, waist (curving in under the heel), heel -->
    <path d="M28 106L22 100V108L28 114Z"/>
    <path d="M36 82Q46 84 46 94V100Q46 105 36 106L30 100Q40 99 40 94V88Q40 78 30 76Z"/>
    <path d="M18 66L12 60V72L18 78Z"/>
  </g>
  <g fill="#CBD5E1">
    <!-- tops: base ledges, horn, step and face -->
    <path d="M28 106H36L30 100H22Z"/>
    <path d="M74 100Q74 105 84 106H92L86 100Z"/>
    <path d="M96 70Q112 70 124 73Q108 64 90 64Z"/>
    <path d="M88 70H96L90 64H82Z"/>
    <path d="M18 66H88L82 60H12Z"/>
  </g>
  <!-- front: face block, step, horn, waist and base with its arch -->
  <path fill="#64748B" d="M18 66H88V70H96Q112 70 124 73Q110 80 96 82H84Q74 84 74 94V100Q74 105 84 106H92V114H72Q72 108 60 108Q48 108 48 114H28V106H36Q46 105 46 100V94Q46 84 36 82H24L18 78Z"/>

  <!-- hot metal on the face, where the hammer just struck -->
  <ellipse cx="56" cy="63" rx="14" ry="4" fill="url(#hotspot)"/>

  <!-- sparks fanning out from the strike, sagging as they fall -->
  <g fill="none" stroke-linecap="round">
    <g stroke="#F97316" stroke-opacity="0.55" filter="url(#glow)" stroke-width="2.6">
      <path d="M50.3 59.0Q37.6 49.0 24.9 44.9"/>
      <path d="M53.8 57.4Q46.6 38.5 39.5 26.8"/>
      <path d="M56.8 57.1Q59.2 39.0 61.6 27.5"/>
      <path d="M58.8 56.6Q64.7 42.3 70.6 33.6"/>
    </g>
    <path stroke="#FBBF24" stroke-width="1.4" d="M48.4 60.5Q37.9 56.3 27.5 56.4"/>
    <path stroke="#F59E0B" stroke-width="1.8" d="M50.3 59.0Q37.6 49.0 24.9 44.9"/>
    <path stroke="#FB923C" stroke-width="1.5" d="M52.3 58.3Q43.7 46.2 35.1 39.6"/>
    <path stroke="#F59E0B" stroke-width="2.0" d="M53.8 57.4Q46.6 38.5 39.5 26.8"/>
    <path stroke="#FBBF24" stroke-width="1.3" d="M55.1 56.1Q53.7 43.8 52.3 36.0"/>
    <path stroke="#F59E0B" stroke-width="1.8" d="M56.8 57.1Q59.2 39.0 61.6 27.5"/>
    <path stroke="#FB923C" stroke-width="1.6" d="M58.8 56.6Q64.7 42.3 70.6 33.6"/>
    <path stroke="#FBBF24" stroke-width="1.4" d="M59.9 58.4Q68.2 47.5 76.6 41.6"/>
    <path stroke="#F97316" stroke-width="1.2" d="M62.8 58.8Q70.4 53.3 78.0 51.4"/>
  </g>
  <!-- loose embers past the ends of the streaks -->
  <g fill="#F59E0B">
    <circle cx="20.5" cy="44.5" r="1.1"/>
    <circle cx="36.5" cy="22" r="1.2"/>
    <circle cx="47" cy="30" r="0.8"/>
    <circle cx="63" cy="21.5" r="1"/>
    <circle cx="80" cy="38.5" r="0.9"/>
    <circle cx="83" cy="51" r="1"/>
    <circle cx="30" cy="35" r="0.7"/>
  </g>
  </g>
</svg>
