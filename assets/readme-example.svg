<svg xmlns="http://www.w3.org/2000/svg" width="843" height="852" viewBox="0 0 843 852" role="img" aria-label="Weightsmith code">
<style>svg{fill:#1E293B}svg .c{fill:#64748B;font-style:italic}svg .k{fill:#B45309;font-weight:600}svg .kd{fill:#B45309;font-weight:600}svg .kp{fill:#C2410C}svg .kc{fill:#7C3AED}svg .nc{fill:#1D4ED8;font-weight:600}svg .nv{fill:#1D4ED8}svg .nb{fill:#0F766E}svg .na{fill:#475569}svg .np{fill:#0369A1}svg .s{fill:#15803D}svg .m{fill:#7C3AED}svg .o{fill:#64748B}svg .p{fill:#64748B}svg .bg{fill:#F8FAFC;background:#F8FAFC;stroke:#E2E8F0;border-color:#E2E8F0}svg .title{fill:#64748B}@media (prefers-color-scheme:dark){svg{fill:#E2E8F0}svg .c{fill:#94A3B8;font-style:italic}svg .k{fill:#FBBF24;font-weight:600}svg .kd{fill:#FBBF24;font-weight:600}svg .kp{fill:#FB923C}svg .kc{fill:#C4B5FD}svg .nc{fill:#93C5FD;font-weight:600}svg .nv{fill:#93C5FD}svg .nb{fill:#5EEAD4}svg .na{fill:#CBD5E1}svg .np{fill:#7DD3FC}svg .s{fill:#86EFAC}svg .m{fill:#C4B5FD}svg .o{fill:#94A3B8}svg .p{fill:#94A3B8}svg .bg{fill:#0F172A;background:#0F172A;stroke:#1E293B;border-color:#1E293B}svg .title{fill:#94A3B8}}text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:14px;white-space:pre}</style>
<rect class="bg" x="0.5" y="0.5" width="842" height="851" rx="8"/>
<text x="20" y="34" xml:space="preserve"><tspan class="c">// Abridged from examples/repair_with_claude.wsm</tspan></text>
<text x="20" y="55" xml:space="preserve"><tspan class="kd">model</tspan> <tspan class="nv">LM</tspan> <tspan class="o">=</tspan> <tspan class="nb">load</tspan><tspan class="p">(</tspan><tspan class="s">&quot;</tspan><tspan class="s">fixtures/tiny_llama_defective</tspan><tspan class="s">&quot;</tspan><tspan class="p">)</tspan></text>
<text x="20" y="76" xml:space="preserve"></text>
<text x="20" y="97" xml:space="preserve"><tspan class="kd">behavior</tspan> <tspan class="nv">count_test</tspan>    <tspan class="o">=</tspan> <tspan class="nb">probes</tspan><tspan class="p">(</tspan><tspan class="s">&quot;</tspan><tspan class="s">fixtures/tiny_llama/count_test.json</tspan><tspan class="s">&quot;</tspan><tspan class="p">,</tspan>    <tspan class="na">metric</tspan> <tspan class="o">=</tspan> <tspan class="nb">accuracy</tspan><tspan class="p">)</tspan></text>
<text x="20" y="118" xml:space="preserve"><tspan class="kd">behavior</tspan> <tspan class="nv">opposite_test</tspan> <tspan class="o">=</tspan> <tspan class="nb">probes</tspan><tspan class="p">(</tspan><tspan class="s">&quot;</tspan><tspan class="s">fixtures/tiny_llama/opposite_test.json</tspan><tspan class="s">&quot;</tspan><tspan class="p">,</tspan> <tspan class="na">metric</tspan> <tspan class="o">=</tspan> <tspan class="nb">accuracy</tspan><tspan class="p">)</tspan></text>
<text x="20" y="139" xml:space="preserve"><tspan class="kd">behavior</tspan> <tspan class="nv">first_test</tspan>    <tspan class="o">=</tspan> <tspan class="nb">probes</tspan><tspan class="p">(</tspan><tspan class="s">&quot;</tspan><tspan class="s">fixtures/tiny_llama/first_test.json</tspan><tspan class="s">&quot;</tspan><tspan class="p">,</tspan>    <tspan class="na">metric</tspan> <tspan class="o">=</tspan> <tspan class="nb">accuracy</tspan><tspan class="p">)</tspan></text>
<text x="20" y="160" xml:space="preserve"></text>
<text x="20" y="181" xml:space="preserve"><tspan class="kd">editor</tspan> <tspan class="nv">Claude</tspan> <tspan class="o">=</tspan> <tspan class="nb">provider</tspan><tspan class="p">(</tspan><tspan class="s">&quot;</tspan><tspan class="s">anthropic</tspan><tspan class="s">&quot;</tspan><tspan class="p">,</tspan> <tspan class="kd">model</tspan> <tspan class="o">=</tspan> <tspan class="s">&quot;</tspan><tspan class="s">claude-opus-5-5</tspan><tspan class="s">&quot;</tspan><tspan class="p">,</tspan> <tspan class="na">effort</tspan> <tspan class="o">=</tspan> <tspan class="s">&quot;</tspan><tspan class="s">high</tspan><tspan class="s">&quot;</tspan><tspan class="p">)</tspan></text>
<text x="20" y="202" xml:space="preserve"></text>
<text x="20" y="223" xml:space="preserve"><tspan class="kd">program</tspan> <tspan class="nc">RepairWithClaude</tspan> <tspan class="p">{</tspan></text>
<text x="20" y="244" xml:space="preserve">    <tspan class="k">target</tspan> <tspan class="nv">LM</tspan></text>
<text x="20" y="265" xml:space="preserve"></text>
<text x="20" y="286" xml:space="preserve">    <tspan class="k">policy</tspan> <tspan class="p">{</tspan></text>
<text x="20" y="307" xml:space="preserve">        <tspan class="kp">allow</tspan> <tspan class="nb">probe</tspan><tspan class="p">(</tspan><tspan class="na">max_forward_passes</tspan> <tspan class="o">=</tspan> <tspan class="m">2000</tspan><tspan class="p">)</tspan></text>
<text x="20" y="328" xml:space="preserve">        <tspan class="kp">allow</tspan> <tspan class="nb">mutate</tspan><tspan class="p">(</tspan><tspan class="na">max_changed_params</tspan> <tspan class="o">=</tspan> <tspan class="m">1%</tspan><tspan class="p">)</tspan></text>
<text x="20" y="349" xml:space="preserve">        <tspan class="kp">allow</tspan> <tspan class="nb">reason</tspan><tspan class="p">(</tspan><tspan class="na">max_calls</tspan> <tspan class="o">=</tspan> <tspan class="m">30</tspan><tspan class="p">,</tspan> <tspan class="na">max_tokens</tspan> <tspan class="o">=</tspan> <tspan class="m">2000000</tspan><tspan class="p">)</tspan></text>
<text x="20" y="370" xml:space="preserve">        <tspan class="kp">allow</tspan> <tspan class="nb">execute</tspan><tspan class="p">(</tspan><tspan class="na">max_seconds</tspan> <tspan class="o">=</tspan> <tspan class="m">300</tspan><tspan class="p">)</tspan></text>
<text x="20" y="391" xml:space="preserve">        <tspan class="kp">allow</tspan> <tspan class="nb">save</tspan></text>
<text x="20" y="412" xml:space="preserve">        <tspan class="kp">forbid</tspan> <tspan class="nb">train</tspan></text>
<text x="20" y="433" xml:space="preserve">    <tspan class="p">}</tspan></text>
<text x="20" y="454" xml:space="preserve"></text>
<text x="20" y="475" xml:space="preserve">    <tspan class="k">contract</tspan> <tspan class="p">{</tspan></text>
<text x="20" y="496" xml:space="preserve">        <tspan class="kp">improve</tspan>  count_test    <tspan class="p">(</tspan><tspan class="na">min_delta</tspan> <tspan class="o">=</tspan> <tspan class="m">0.1</tspan><tspan class="p">)</tspan></text>
<text x="20" y="517" xml:space="preserve">        <tspan class="kp">preserve</tspan> opposite_test <tspan class="p">(</tspan><tspan class="na">tolerance</tspan> <tspan class="o">=</tspan> <tspan class="m">0.07</tspan><tspan class="p">,</tspan> <tspan class="na">min_n</tspan> <tspan class="o">=</tspan> <tspan class="m">16</tspan><tspan class="p">)</tspan></text>
<text x="20" y="538" xml:space="preserve">        <tspan class="kp">preserve</tspan> first_test    <tspan class="p">(</tspan><tspan class="na">tolerance</tspan> <tspan class="o">=</tspan> <tspan class="m">0.02</tspan><tspan class="p">)</tspan></text>
<text x="20" y="559" xml:space="preserve">        <tspan class="kp">require</tspan>  <tspan class="nb">finite</tspan></text>
<text x="20" y="580" xml:space="preserve">    <tspan class="p">}</tspan></text>
<text x="20" y="601" xml:space="preserve"></text>
<text x="20" y="622" xml:space="preserve">    <tspan class="k">delegate</tspan> Claude <tspan class="p">(</tspan></text>
<text x="20" y="643" xml:space="preserve">        <tspan class="na">task</tspan> <tspan class="o">=</tspan> <tspan class="s">&quot;</tspan><tspan class="s">One of this model&#x27;s three tasks is broken. Find out which, find the cause ...</tspan><tspan class="s">&quot;</tspan><tspan class="p">,</tspan></text>
<text x="20" y="664" xml:space="preserve">        <tspan class="na">tools</tspan> <tspan class="o">=</tspan> <tspan class="p">[</tspan><tspan class="nb">describe</tspan><tspan class="p">,</tspan> <tspan class="nb">read_weights</tspan><tspan class="p">,</tspan> <tspan class="nb">stats</tspan><tspan class="p">,</tspan> <tspan class="k">find</tspan><tspan class="p">,</tspan> <tspan class="nb">run_probes</tspan><tspan class="p">,</tspan></text>
<text x="20" y="685" xml:space="preserve">                 <tspan class="nb">forward</tspan><tspan class="p">,</tspan> <tspan class="k">edit</tspan><tspan class="p">,</tspan> <tspan class="nb">set_weights</tspan><tspan class="p">,</tspan> <tspan class="nb">undo</tspan><tspan class="p">,</tspan> <tspan class="nb">python</tspan><tspan class="p">]</tspan><tspan class="p">,</tspan></text>
<text x="20" y="706" xml:space="preserve">        <tspan class="na">practice</tspan> <tspan class="o">=</tspan> <tspan class="p">[</tspan>count_train<tspan class="p">,</tspan> opposite_train<tspan class="p">,</tspan> first_train<tspan class="p">]</tspan><tspan class="p">,</tspan></text>
<text x="20" y="727" xml:space="preserve">        <tspan class="na">max_steps</tspan> <tspan class="o">=</tspan> <tspan class="m">30</tspan></text>
<text x="20" y="748" xml:space="preserve">    <tspan class="p">)</tspan></text>
<text x="20" y="769" xml:space="preserve">    <tspan class="k">verify</tspan></text>
<text x="20" y="790" xml:space="preserve"></text>
<text x="20" y="811" xml:space="preserve">    <tspan class="k">output</tspan> <tspan class="p">{</tspan> <tspan class="kd">model</tspan><tspan class="p">,</tspan> <tspan class="nb">patch</tspan><tspan class="p">,</tspan> <tspan class="nb">evaluation</tspan> <tspan class="p">}</tspan></text>
<text x="20" y="832" xml:space="preserve"><tspan class="p">}</tspan></text>
</svg>
