<rect class="bg" x="0.5" y="0.5" width="715" height="578" rx="8"/>
<text x="20" y="34" xml:space="preserve"><tspan class="kd">model</tspan> <tspan class="nv">Base</tspan> <tspan class="o">=</tspan> <tspan class="nb">load</tspan><tspan class="p">(</tspan><tspan class="s">&quot;</tspan><tspan class="s">fixtures/tiny_mlp_defective</tspan><tspan class="s">&quot;</tspan><tspan class="p">)</tspan></text>
<text x="20" y="55" xml:space="preserve"><tspan class="kd">behavior</tspan> <tspan class="nv">parity</tspan>   <tspan class="o">=</tspan> <tspan class="nb">probes</tspan><tspan class="p">(</tspan><tspan class="s">&quot;</tspan><tspan class="s">fixtures/tiny_mlp/parity.json</tspan><tspan class="s">&quot;</tspan><tspan class="p">,</tspan>   <tspan class="na">metric</tspan> <tspan class="o">=</tspan> <tspan class="nb">accuracy</tspan><tspan class="p">)</tspan></text>
<text x="20" y="76" xml:space="preserve"><tspan class="kd">behavior</tspan> <tspan class="nv">majority</tspan> <tspan class="o">=</tspan> <tspan class="nb">probes</tspan><tspan class="p">(</tspan><tspan class="s">&quot;</tspan><tspan class="s">fixtures/tiny_mlp/majority.json</tspan><tspan class="s">&quot;</tspan><tspan class="p">,</tspan> <tspan class="na">metric</tspan> <tspan class="o">=</tspan> <tspan class="nb">accuracy</tspan><tspan class="p">)</tspan></text>
<text x="20" y="97" xml:space="preserve"></text>
<text x="20" y="118" xml:space="preserve"><tspan class="kd">program</tspan> <tspan class="nc">RepairMLP</tspan> <tspan class="p">{</tspan></text>
<text x="20" y="139" xml:space="preserve">    <tspan class="k">target</tspan> <tspan class="nv">Base</tspan></text>
<text x="20" y="160" xml:space="preserve"></text>
<text x="20" y="181" xml:space="preserve">    <tspan class="k">policy</tspan> <tspan class="p">{</tspan></text>
<text x="20" y="202" xml:space="preserve">        <tspan class="kp">allow</tspan> <tspan class="nb">probe</tspan><tspan class="p">(</tspan><tspan class="na">max_forward_passes</tspan> <tspan class="o">=</tspan> <tspan class="m">2000</tspan><tspan class="p">)</tspan></text>
<text x="20" y="223" xml:space="preserve">        <tspan class="kp">allow</tspan> <tspan class="nb">mutate</tspan><tspan class="p">(</tspan><tspan class="na">max_changed_params</tspan> <tspan class="o">=</tspan> <tspan class="m">10%</tspan><tspan class="p">)</tspan></text>
<text x="20" y="244" xml:space="preserve">        <tspan class="kp">allow</tspan> <tspan class="nb">save</tspan></text>
<text x="20" y="265" xml:space="preserve">        <tspan class="kp">forbid</tspan> <tspan class="nb">train</tspan></text>
<text x="20" y="286" xml:space="preserve">    <tspan class="p">}</tspan></text>
<text x="20" y="307" xml:space="preserve"></text>
<text x="20" y="328" xml:space="preserve">    <tspan class="k">contract</tspan> <tspan class="p">{</tspan></text>
<text x="20" y="349" xml:space="preserve">        <tspan class="kp">improve</tspan>  parity   <tspan class="p">(</tspan><tspan class="na">min_delta</tspan> <tspan class="o">=</tspan> <tspan class="m">0.25</tspan><tspan class="p">)</tspan></text>
<text x="20" y="370" xml:space="preserve">        <tspan class="kp">preserve</tspan> majority <tspan class="p">(</tspan><tspan class="na">tolerance</tspan> <tspan class="o">=</tspan> <tspan class="m">0.02</tspan><tspan class="p">)</tspan></text>
<text x="20" y="391" xml:space="preserve">        <tspan class="kp">require</tspan>  <tspan class="nb">finite</tspan></text>
<text x="20" y="412" xml:space="preserve">    <tspan class="p">}</tspan></text>
<text x="20" y="433" xml:space="preserve"></text>
<text x="20" y="454" xml:space="preserve">    <tspan class="k">find</tspan> <tspan class="nb">anomalies</tspan> <tspan class="p">(</tspan><tspan class="na">kinds</tspan> <tspan class="o">=</tspan> <tspan class="p">[</tspan><tspan class="nb">outlier_rows</tspan><tspan class="p">,</tspan> <tspan class="nb">nan_inf</tspan><tspan class="p">]</tspan><tspan class="p">)</tspan></text>
<text x="20" y="475" xml:space="preserve">    <tspan class="k">repair</tspan> <tspan class="p">(</tspan><tspan class="na">strategies</tspan> <tspan class="o">=</tspan> <tspan class="p">[</tspan><tspan class="nb">rescale_outlier_rows</tspan><tspan class="p">,</tspan> <tspan class="nb">replace_nonfinite</tspan><tspan class="p">]</tspan><tspan class="p">)</tspan></text>
<text x="20" y="496" xml:space="preserve">    <tspan class="k">verify</tspan></text>
<text x="20" y="517" xml:space="preserve"></text>
<text x="20" y="538" xml:space="preserve">    <tspan class="k">output</tspan> <tspan class="p">{</tspan> <tspan class="kd">model</tspan><tspan class="p">,</tspan> <tspan class="nb">patch</tspan><tspan class="p">,</tspan> <tspan class="nb">findings</tspan><tspan class="p">,</tspan> <tspan class="nb">evidence</tspan><tspan class="p">,</tspan> <tspan class="nb">evaluation</tspan> <tspan class="p">}</tspan></text>
<text x="20" y="559" xml:space="preserve"><tspan class="p">}</tspan></text>
